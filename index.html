<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Shahar & 4 Olam — 3D Sivilizatsiya Simulyatori</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #101820; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #f3f6fa; touch-action: none;
    }
    #canvas-wrap { position: fixed; inset: 0; width: 100%; height: 100%; }

    /* Yuqori panel */
    #top-bar {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 20;
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between;
      pointer-events: none;
    }
    .hud-card {
      pointer-events: auto;
      background: rgba(16, 24, 35, 0.84); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.14); border-radius: 12px;
      padding: 8px 12px; font-size: 13px; line-height: 1.35;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    .hud-title { font-weight: 700; color: #7dd3fc; font-size: 14px; }
    .hud-sub { color: #cbd5e1; font-size: 12px; }
    .btn-pill {
      pointer-events: auto;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: #fff; border: none; border-radius: 10px; padding: 8px 12px;
      font-weight: 600; font-size: 12px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(14,165,233,0.35);
    }
    .btn-pill:active { transform: scale(0.97); }
    .btn-pill.secondary { background: rgba(51,65,85,0.9); box-shadow: none; }
    .btn-pill.gold { background: linear-gradient(135deg, #d97706, #f59e0b); }

    /* Sensorli Joystik */
    #joy-zone {
      position: fixed; left: 22px; bottom: 22px; width: 136px; height: 136px;
      z-index: 25; border-radius: 50%;
      background: rgba(15, 23, 42, 0.55); border: 2px solid rgba(255,255,255,0.22);
      display: flex; align-items: center; justify-content: center;
    }
    #joy-knob {
      width: 56px; height: 56px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #0284c7);
      border: 2px solid rgba(255,255,255,0.65);
      transform: translate(0px, 0px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.45);
    }

    /* Kontekstli Harakat Tugmalari */
    #action-zone {
      position: fixed; right: 20px; bottom: 22px; z-index: 25;
      display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
      max-width: 280px;
    }
    .action-btn {
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: #fff; border: 2px solid rgba(255,255,255,0.45);
      border-radius: 14px; padding: 12px 18px; font-size: 14px; font-weight: 700;
      cursor: pointer; box-shadow: 0 8px 22px rgba(22,163,74,0.45);
      min-width: 170px; text-align: center;
    }
    .action-btn:active { transform: scale(0.96); }
    .action-btn.blue { background: linear-gradient(135deg, #2563eb, #3b82f6); box-shadow: 0 8px 22px rgba(37,99,235,0.45); }
    .action-btn.amber { background: linear-gradient(135deg, #d97706, #f59e0b); box-shadow: 0 8px 22px rgba(217,119,6,0.45); }
    .action-btn.purple { background: linear-gradient(135deg, #7c3aed, #a855f7); box-shadow: 0 8px 22px rgba(124,58,237,0.45); }

    /* Modal Oyna */
    #modal-backdrop {
      position: fixed; inset: 0; z-index: 40; display: none;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(2, 6, 23, 0.72); backdrop-filter: blur(6px);
    }
    #modal-box {
      width: 100%; max-width: 640px; max-height: 82vh; overflow-y: auto;
      background: #0f172a; border: 1px solid rgba(148,163,184,0.28);
      border-radius: 16px; padding: 18px; box-shadow: 0 20px 50px rgba(0,0,0,0.65);
    }
    .modal-head {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(148,163,184,0.18); padding-bottom: 10px; margin-bottom: 14px;
    }
    .modal-title { font-size: 17px; font-weight: 700; color: #f8fafc; }
    .close-btn {
      background: #334155; color: #fff; border: none; border-radius: 8px;
      padding: 6px 12px; font-weight: 700; cursor: pointer;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
    .stat-box {
      background: rgba(30,41,59,0.75); border: 1px solid rgba(148,163,184,0.16);
      border-radius: 10px; padding: 10px 12px; font-size: 13px;
    }
    .row-flex { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
    .mini-btn {
      background: #0284c7; color: #fff; border: none; border-radius: 7px;
      padding: 5px 10px; font-weight: 700; cursor: pointer; font-size: 12px;
    }
    .mini-btn.gray { background: #475569; }
    #toast {
      position: fixed; top: 82px; left: 50%; transform: translateX(-50%);
      z-index: 35; background: rgba(15,23,42,0.92); border: 1px solid #38bdf8;
      color: #e0f2fe; padding: 8px 16px; border-radius: 999px; font-size: 13px;
      font-weight: 600; display: none; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="toast"></div>

  <div id="top-bar">
    <div class="hud-card" id="hud-world">
      <div class="hud-title" id="world-label">Asosiy Olam — Qishloq (1/5)</div>
      <div class="hud-sub" id="world-sub">Binolar: 5/20 | Aholi: 12 | Ovqat: 150 | Koordinata: (0, 0)</div>
    </div>
    <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:flex-start;">
      <button class="btn-pill gold" id="btn-open-upgrade">Rivojlanish (5 Bosqich)</button>
      <button class="btn-pill" id="btn-open-warehouse">Katta Ombor</button>
      <button class="btn-pill secondary" id="btn-open-map">60k Xarita</button>
    </div>
  </div>

  <!-- Sensorli Joystik -->
  <div id="joy-zone">
    <div id="joy-knob"></div>
  </div>

  <!-- Sensorli Harakat Tugmalari -->
  <div id="action-zone"></div>

  <!-- Modal Oyna -->
  <div id="modal-backdrop">
    <div id="modal-box">
      <div class="modal-head">
        <div class="modal-title" id="modal-title">Oyna</div>
        <button class="close-btn" id="modal-close">Yopish</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    // =========================================================================
    // 1. O'YIN HOLATI VA KONFIGURATSIYA
    // =========================================================================
    const TIERS = [
      { level: 1, name: "Qishloq",   buildingsCount: 5,  popCap: 24,  cost: {} },
      { level: 2, name: "Shaharcha", buildingsCount: 7,  popCap: 45,  cost: { yogoch: 40, tosh: 30, oltin: 20 } },
      { level: 3, name: "Shahar",    buildingsCount: 11, popCap: 90,  cost: { yogoch: 90, tosh: 80, temir: 40, oltin: 50 } },
      { level: 4, name: "Graflik",   buildingsCount: 15, popCap: 160, cost: { yogoch: 160, tosh: 150, temir: 90, oltin: 110, tuya: 15 } },
      { level: 5, name: "Qirollik",  buildingsCount: 20, popCap: 300, cost: { yogoch: 260, tosh: 250, temir: 160, oltin: 220, tuya: 35, suv: 120 } }
    ];

    const RESOURCE_META = {
      yogoch: { label: "Yog'och",        world: "O'rmon" },
      gosht:  { label: "Hayvon go'shti", world: "O'rmon" },
      tosh:   { label: "Tosh",           world: "Tog'" },
      temir:  { label: "Temir",          world: "Tog'" },
      tuya:   { label: "Tuya",           world: "Cho'l" },
      oltin:  { label: "Oltin",          world: "Cho'l" },
      suv:    { label: "Suv",            world: "Dengiz" },
      baliq:  { label: "Baliq",          world: "Dengiz" }
    };

    const ALL_20_BUILDINGS = [
      { id: "b1",  tierReq: 1, baseName: "Asosiy Uy",         kind: "home",     x: -24,  z: -16 },
      { id: "b2",  tierReq: 1, baseName: "Aholi Yig'ini",     kind: "council",  x: 0,    z: -24 },
      { id: "b3",  tierReq: 1, baseName: "Tegirmon",          kind: "mill",     x: 24,   z: -16 },
      { id: "b4",  tierReq: 1, baseName: "Katta Ombor",       kind: "storage",  x: -22,  z: 18 },
      { id: "b5",  tierReq: 1, baseName: "Turar Joy Uyi 1",   kind: "house",    x: 22,   z: 18 },

      { id: "b6",  tierReq: 2, baseName: "Ustaxona",          kind: "workshop", x: -46,  z: -6 },
      { id: "b7",  tierReq: 2, baseName: "Turar Joy Uyi 2",   kind: "house",    x: 46,   z: -6 },

      { id: "b8",  tierReq: 3, baseName: "Uch Qavatli Bino",  kind: "multi",    x: -46,  z: 24 },
      { id: "b9",  tierReq: 3, baseName: "Temirchixona",      kind: "smith",    x: 46,   z: 24 },
      { id: "b10", tierReq: 3, baseName: "Tibbiyot Punkti",   kind: "clinic",   x: -24,  z: -48 },
      { id: "b11", tierReq: 3, baseName: "Qo'riqchi Minorasi", kind: "tower",    x: 24,   z: -48 },

      { id: "b12", tierReq: 4, baseName: "Qal'a",             kind: "castle",   x: 0,    z: -74 },
      { id: "b13", tierReq: 4, baseName: "Graflik Saroyi",    kind: "palace",   x: -74,  z: -24 },
      { id: "b14", tierReq: 4, baseName: "Ta'minot Markazi",  kind: "depot",    x: 74,   z: -24 },
      { id: "b15", tierReq: 4, baseName: "Harbiy Tayyorlov",   kind: "barracks", x: -74,  z: 24 },

      { id: "b16", tierReq: 5, baseName: "Qirollik Qasri",    kind: "royal",    x: 74,   z: 24 },
      { id: "b17", tierReq: 5, baseName: "Qirollik Kengashi", kind: "council",  x: -50,  z: -72 },
      { id: "b18", tierReq: 5, baseName: "Qirollik Xazinasi", kind: "treasury", x: 50,   z: -72 },
      { id: "b19", tierReq: 5, baseName: "Buyuk Tegirmon",    kind: "mill",     x: -50,  z: 56 },
      { id: "b20", tierReq: 5, baseName: "Qirollik Qo'riqchisi",kind: "tower",   x: 50,   z: 56 }
    ];

    const STAGE_TITLES_BY_KIND = {
      home:     ["Uy", "Mehmonxona", "Uch Qavatli Uy", "Qal'a Uy", "Qasr"],
      house:    ["Kulba", "Keng Uy", "Ikki Qavatli Uy", "Graflik Uyi", "Qirollik Uyi"],
      multi:    ["Kichik Bino", "Mehmonxona", "Uch Qavatli Bino", "Graflik Binosi", "Saroy Binosi"],
      castle:   ["Qal'a", "Mustahkam Qal'a", "Katta Qal'a", "Graflik Qal'asi", "Buyuk Qal'a"],
      palace:   ["Saroycha", "Hokimiyat", "Shahar Saroyi", "Graflik Saroyi", "Qirollik Saroyi"],
      royal:    ["Qasrcha", "Katta Uy", "Saroy", "Qal'a-Qasr", "Qirollik Qasri"],
      council:  ["Kichik Yig'in", "Boshqaruv Uyi", "Shahar Kengashi", "Graflik Majlisi", "Qirollik Kengashi"],
      mill:     ["Qo'l Tegirmoni", "Shamol Tegirmoni", "Yirik Tegirmon", "Tegirmon Majmuasi", "Qirollik Tegirmoni"],
      storage:  ["Kichik Ombor", "Keng Ombor", "Ko'p Qavatli Ombor", "Graflik Ombori", "Cheksiz Xazina"],
      depot:    ["Ta'minot Nuqtasi", "Yukxona", "Markaziy Ombor", "Graflik Markazi", "Qirollik Ta'minoti"],
      treasury: ["Sandiqxona", "Xazina", "Katta Xazina", "Graflik Xazinasi", "Qirollik Xazinasi"],
      workshop: ["Ustaxona", "Keng Ustaxona", "Ishlab Chiqarish", "Graflik Ustaxonasi", "Qirollik Ustaxonasi"],
      smith:    ["Temirchixona", "O'choqxona", "Metall Sexi", "Graflik Temirchisi", "Qirollik Temirchisi"],
      clinic:   ["Quduq/Shifo", "Tibbiyot Uyi", "Shifoxona", "Graflik Shifosi", "Qirollik Shifosi"],
      tower:    ["Panjara Posti", "Qo'riqchi Uyi", "Qo'riqchi Minorasi", "Graflik Minorasi", "Qirollik Minorasi"],
      barracks: ["Mashq Joyi", "Qo'shin Uyi", "Kazarma", "Graflik Qo'shini", "Qirollik Gvardiyasi"]
    };

    const state = {
      currentWorld: "main",
      civTier: 1,
      buildingLevels: {},
      warehouse: {
        yogoch: 120, gosht: 90,
        tosh: 110,   temir: 60,
        tuya: 10,    oltin: 80,
        suv: 140,    baliq: 85
      },
      ratesPerSec: {
        yogoch: 0, gosht: 0,
        tosh: 0,   temir: 0,
        tuya: 0,   oltin: 0,
        suv: 0,    baliq: 0
      },
      population: 12,
      food: 150,
      energy: 100,
      workers: { mill: 3, sex: 4, builder: 2 },
      sexes: {
        ormon:  { built: false, level: 1, workers: 1, resA: "yogoch", resB: "gosht" },
        tog:    { built: false, level: 1, workers: 1, resA: "tosh",   resB: "temir" },
        chol:   { built: false, level: 1, workers: 1, resA: "tuya",   resB: "oltin" },
        dengiz: { built: false, level: 1, workers: 1, resA: "suv",    resB: "baliq" }
      },
      insideBuilding: null,
      doorsOpen: {}
    };

    ALL_20_BUILDINGS.forEach(b => { state.buildingLevels[b.id] = 1; });

    function getBuildingDisplayName(b) {
      const lvl = state.buildingLevels[b.id] || 1;
      const arr = STAGE_TITLES_BY_KIND[b.kind] || [b.baseName];
      return `${arr[Math.min(lvl - 1, arr.length - 1)]} (Lv.${lvl})`;
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { el.style.display = "none"; }, 2400);
    }

    // =========================================================================
    // 2. THREE.JS SAHNA, KAMERA VA TO'LIQ 3D GAVDALI ODAM + YUK KO'TARISH
    // =========================================================================
    const container = document.getElementById("canvas-wrap");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x69a7d8);
    scene.fog = new THREE.FogExp2(0x69a7d8, 0.0022);

    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.2, 1200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x3b4d3b, 0.9);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff7e6, 1.25);
    dirLight.position.set(45, 75, 35);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    const dCam = 85;
    dirLight.shadow.camera.left = -dCam;
    dirLight.shadow.camera.right = dCam;
    dirLight.shadow.camera.top = dCam;
    dirLight.shadow.camera.bottom = -dCam;
    scene.add(dirLight);
    scene.add(dirLight.target);

    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    function createFullBodyHuman({ shirtHex = 0x1d4ed8, pantsHex = 0x1e293b, hairHex = 0x231f20, skinHex = 0xe8b896, carryType = null }) {
      const root = new THREE.Group();

      const skinMat  = new THREE.MeshStandardMaterial({ color: skinHex, roughness: 0.65 });
      const hairMat  = new THREE.MeshStandardMaterial({ color: hairHex, roughness: 0.7 });
      const shirtMat = new THREE.MeshStandardMaterial({ color: shirtHex, roughness: 0.6 });
      const pantsMat = new THREE.MeshStandardMaterial({ color: pantsHex, roughness: 0.7 });
      const bootMat  = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.8 });

      // Uzun oyoqlar (0.95)
      const legGeo = new THREE.BoxGeometry(0.22, 0.95, 0.24);
      const leftLegPivot = new THREE.Group();
      leftLegPivot.position.set(-0.15, 0.95, 0);
      const leftLeg = new THREE.Mesh(legGeo, pantsMat);
      leftLeg.position.y = -0.475;
      leftLeg.castShadow = true;
      const leftBoot = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.14, 0.34), bootMat);
      leftBoot.position.set(0, -0.9, 0.05);
      leftLegPivot.add(leftLeg, leftBoot);

      const rightLegPivot = new THREE.Group();
      rightLegPivot.position.set(0.15, 0.95, 0);
      const rightLeg = new THREE.Mesh(legGeo, pantsMat);
      rightLeg.position.y = -0.475;
      rightLeg.castShadow = true;
      const rightBoot = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.14, 0.34), bootMat);
      rightBoot.position.set(0, -0.9, 0.05);
      rightLegPivot.add(rightLeg, rightBoot);

      // Uzun gavda (0.85)
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.85, 0.28), shirtMat);
      torso.position.set(0, 0.95 + 0.425, 0);
      torso.castShadow = true;

      // Uzun qo'llar (0.78)
      const armGeo = new THREE.BoxGeometry(0.17, 0.78, 0.18);
      const leftArmPivot = new THREE.Group();
      leftArmPivot.position.set(-0.37, 1.74, 0);
      const leftArm = new THREE.Mesh(armGeo, shirtMat);
      leftArm.position.y = -0.34;
      const leftHand = new THREE.Mesh(new THREE.SphereGeometry(0.095, 10, 10), skinMat);
      leftHand.position.y = -0.74;
      leftArmPivot.add(leftArm, leftHand);

      const rightArmPivot = new THREE.Group();
      rightArmPivot.position.set(0.37, 1.74, 0);
      const rightArm = new THREE.Mesh(armGeo, shirtMat);
      rightArm.position.y = -0.34;
      const rightHand = new THREE.Mesh(new THREE.SphereGeometry(0.095, 10, 10), skinMat);
      rightHand.position.y = -0.74;
      rightArmPivot.add(rightArm, rightHand);

      // Bosh
      const headGroup = new THREE.Group();
      headGroup.position.set(0, 1.82, 0);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16), skinMat);
      head.position.y = 0.24;
      head.castShadow = true;
      const hair = new THREE.Mesh(new THREE.SphereGeometry(0.255, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.58), hairMat);
      hair.position.set(0, 0.26, -0.02);
      headGroup.add(head, hair);

      // Agar yuk ko'targan ishchi bo'lsa: qo'llari oldinga ko'tarilib qop yoki sandiq ko'taradi
      let cargoMesh = null;
      if (carryType === "sack") {
        cargoMesh = new THREE.Mesh(
          new THREE.DodecahedronGeometry(0.32, 1),
          new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.85 })
        );
        cargoMesh.scale.set(1.15, 0.85, 0.95);
        cargoMesh.position.set(0, 1.28, 0.42);
        cargoMesh.castShadow = true;
      } else if (carryType === "crate") {
        cargoMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.58, 0.36, 0.42),
          new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.75 })
        );
        cargoMesh.position.set(0, 1.28, 0.42);
        cargoMesh.castShadow = true;
      }
      if (cargoMesh) {
        root.add(cargoMesh);
        leftArmPivot.rotation.x = -0.95;
        rightArmPivot.rotation.x = -0.95;
      }

      root.add(leftLegPivot, rightLegPivot, torso, leftArmPivot, rightArmPivot, headGroup);
      root.userData = {
        leftLegPivot, rightLegPivot, leftArmPivot, rightArmPivot,
        carrying: Boolean(cargoMesh),
        walkPhase: Math.random() * Math.PI * 2
      };
      return root;
    }

    const player = createFullBodyHuman({ shirtHex: 0x1d4ed8, pantsHex: 0x1e293b, hairHex: 0x111827 });
    player.position.set(0, 0, 8);
    scene.add(player);

    // =========================================================================
    // 3. AHOLI (NPC) 3D GAVDALARI — TASHQARIDA YUK BILAN VA BINOLAR ICHIDA
    // =========================================================================
    const npcGroup = new THREE.Group();
    scene.add(npcGroup);
    let npcs = []; // { mesh, role, waypoints, wpIndex, waitTimer, speed }

    function getNpcRoleConfig(role) {
      if (role === "mill") {
        return {
          shirtHex: 0x15803d, pantsHex: 0x365314, hairHex: 0x451a03, carryType: "sack",
          waypoints: [new THREE.Vector3(24, 0, -10), new THREE.Vector3(-22, 0, 12), new THREE.Vector3(0, 0, -14)]
        };
      }
      if (role === "sex") {
        return {
          shirtHex: 0x0369a1, pantsHex: 0x1e3a8a, hairHex: 0x1f2937, carryType: "crate",
          waypoints: [new THREE.Vector3(-22, 0, 12), new THREE.Vector3(68, 0, 4), new THREE.Vector3(114, 0, 0)]
        };
      }
      if (role === "builder") {
        return {
          shirtHex: 0xb45309, pantsHex: 0x334155, hairHex: 0x0f172a, carryType: null,
          waypoints: [new THREE.Vector3(-34, 0, -28), new THREE.Vector3(34, 0, -28), new THREE.Vector3(34, 0, 30), new THREE.Vector3(-34, 0, 30)]
        };
      }
      return {
        shirtHex: 0x64748b, pantsHex: 0x1e293b, hairHex: 0x3f2e21, carryType: null,
        waypoints: [new THREE.Vector3(-16, 0, 6), new THREE.Vector3(16, 0, 6), new THREE.Vector3(0, 0, -10)]
      };
    }

    function rebuild3DNpcs() {
      while (npcGroup.children.length > 0) {
        npcGroup.remove(npcGroup.children[0]);
      }
      npcs = [];

      // Agar bino ichida bo'lsak, bino ichidagi 3D ishchilarni joylashtiramiz
      if (state.insideBuilding) {
        const b = state.insideBuilding;
        const lvl = state.buildingLevels[b.id] || 1;
        const roomCount = Math.min(4, 1 + Math.floor((lvl + 1) / 2));
        const totalW = 14 * roomCount;

        const indoorWorkers = [
          { role: "mill",    x: Math.min(totalW / 2 - 4.5, 10) - 1.8, z: -2.6, rotY: 0.4 },
          { role: "sex",     x: Math.min(totalW / 2 - 4.5, 10) - 1.8, z: 2.2,  rotY: 1.2 },
          { role: "builder", x: -1.8,                                 z: -2.2, rotY: -0.4 }
        ];

        indoorWorkers.forEach((iw, idx) => {
          const cfg = getNpcRoleConfig(iw.role);
          const mesh = createFullBodyHuman({ ...cfg, carryType: idx === 1 ? "crate" : null });
          mesh.position.set(iw.x, 0, iw.z);
          mesh.rotation.y = iw.rotY;
          npcGroup.add(mesh);

          npcs.push({
            mesh,
            role: iw.role,
            waypoints: [
              new THREE.Vector3(iw.x, 0, iw.z),
              new THREE.Vector3(iw.x + 2.2, 0, iw.z + 1.5)
            ],
            wpIndex: 0,
            waitTimer: 1.2 + idx * 0.7,
            speed: 2.1
          });
        });
        return;
      }

      // Asosiy olam (Shahar) tashqarisidagi 3D aholi
      if (state.currentWorld !== "main") return;

      const visibleCount = Math.min(state.population, 28);
      const roles = [];
      for (let i = 0; i < state.workers.mill; i++) roles.push("mill");
      for (let i = 0; i < state.workers.sex; i++) roles.push("sex");
      for (let i = 0; i < state.workers.builder; i++) roles.push("builder");
      while (roles.length < visibleCount) roles.push("citizen");

      for (let i = 0; i < visibleCount; i++) {
        const role = roles[i];
        const cfg = getNpcRoleConfig(role);
        const mesh = createFullBodyHuman(cfg);
        const wpStart = cfg.waypoints[i % cfg.waypoints.length].clone();
        wpStart.x += (Math.random() - 0.5) * 8;
        wpStart.z += (Math.random() - 0.5) * 8;
        mesh.position.copy(wpStart);
        npcGroup.add(mesh);

        const shiftedWaypoints = cfg.waypoints.map(v =>
          new THREE.Vector3(v.x + (Math.random() - 0.5) * 6, 0, v.z + (Math.random() - 0.5) * 6)
        );

        npcs.push({
          mesh,
          role,
          waypoints: shiftedWaypoints,
          wpIndex: (i + 1) % shiftedWaypoints.length,
          waitTimer: Math.random() * 1.4,
          speed: 3.3 + Math.random() * 1.6
        });
      }
    }

    function update3DNpcs(dt) {
      if (npcs.length === 0) return;

      npcs.forEach(npc => {
        if (npc.waitTimer > 0) {
          npc.waitTimer -= dt;
          npc.mesh.userData.leftLegPivot.rotation.x *= 0.82;
          npc.mesh.userData.rightLegPivot.rotation.x *= 0.82;
          if (!npc.mesh.userData.carrying) {
            npc.mesh.userData.leftArmPivot.rotation.x *= 0.82;
            npc.mesh.userData.rightArmPivot.rotation.x *= 0.82;
          }
          return;
        }

        const target = npc.waypoints[npc.wpIndex];
        const dx = target.x - npc.mesh.position.x;
        const dz = target.z - npc.mesh.position.z;
        const dist = Math.hypot(dx, dz);

        if (dist < 1.1) {
          npc.wpIndex = (npc.wpIndex + 1) % npc.waypoints.length;
          npc.waitTimer = 0.7 + Math.random() * 1.6;
          return;
        }

        const vx = dx / dist;
        const vz = dz / dist;
        npc.mesh.position.x += vx * npc.speed * dt;
        npc.mesh.position.z += vz * npc.speed * dt;
        npc.mesh.rotation.y = Math.atan2(vx, vz);

        npc.mesh.userData.walkPhase += dt * 9.5;
        const swing = Math.sin(npc.mesh.userData.walkPhase) * 0.6;
        npc.mesh.userData.leftLegPivot.rotation.x = swing;
        npc.mesh.userData.rightLegPivot.rotation.x = -swing;

        if (!npc.mesh.userData.carrying) {
          npc.mesh.userData.leftArmPivot.rotation.x = -swing * 0.7;
          npc.mesh.userData.rightArmPivot.rotation.x = swing * 0.7;
        }
      });
    }

    function makeTextSprite(text, bgColor = "rgba(15,23,42,0.85)", fgColor = "#ffffff") {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.roundRect(16, 20, 480, 88, 24);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.font = "bold 42px sans-serif";
      ctx.fillStyle = fgColor;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 256, 65);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(7.5, 1.9, 1);
      return sprite;
    }

                     (b.kind === "storage" || b.kind === "mill") ? 12 : 9.5;

      const g = new THREE.Group();
      g.position.set(b.x, 0, b.z);

      const plinth = new THREE.Mesh(
        new THREE.BoxGeometry(width + 1.2, 0.7, depth + 1.2),

        roughness: 0.75

      const backWall = new THREE.Mesh(new THREE.BoxGeometry(width, height, 0.6), wallMat);
      backWall.position.set(0, 0.7 + height / 2, -depth / 2 + 0.3);
      backWall.castShadow = true;
      backWall.receiveShadow = true;

      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.6, height, depth), wallMat);
      leftWall.position.set(-width / 2 + 0.3, 0.7 + height / 2, 0);
      leftWall.castShadow = true;

      const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.6, height, depth), wallMat);
      rightWall.position.set(width / 2 - 0.3, 0.7 + height / 2, 0);
      rightWall.castShadow = true;

      const doorW = 2.6, doorH = 3.4;
      const sideW = (width - doorW) / 2;
      const frontLeft = new THREE.Mesh(new THREE.BoxGeometry(sideW, height, 0.6), wallMat);
      frontLeft.position.set(-doorW / 2 - sideW / 2, 0.7 + height / 2, depth / 2 - 0.3);

      const frontRight = new THREE.Mesh(new THREE.BoxGeometry(sideW, height, 0.6), wallMat);
      frontRight.position.set(doorW / 2 + sideW / 2, 0.7 + height / 2, depth / 2 - 0.3);

      const topLintelH = Math.max(0.8, height - doorH);

      frontTop.position.set(0, 0.7 + doorH + topLintelH / 2, depth / 2 - 0.3);
      frontTop.castShadow = true;

      g.add(backWall, leftWall, rightWall, frontLeft, frontRight, frontTop);

      const roofMat = new THREE.MeshStandardMaterial({
        color: b.kind === "castle" || b.kind === "royal" ? 0x1e3a8a : 0x991b1b,
        roughness: 0.65
      });
      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(Math.max(width, depth) * 0.78, 3.6 + lvl * 0.35, 4),
        roofMat
      );
      roof.position.set(0, 0.7 + height + 1.8 + lvl * 0.17, 0);
      roof.rotation.y = Math.PI / 4;
      roof.castShadow = true;
      g.add(roof);

      if (b.kind === "mill") {
        const blades = new THREE.Group();
        blades.position.set(0, 0.7 + height * 0.7, depth / 2 + 0.5);
        const bladeMat = new THREE.MeshStandardMaterial({ color: 0xfef3c7, side: THREE.DoubleSide });

      doorPivot.position.set(-doorW / 2, 0.7, depth / 2 - 0.3);

      g.add(label);

      worldGroup.add(g);

      const frontDoorWorldX = b.x;

        style: "blue",

        radius: 4.5,

    // =========================================================================
    // 7. IQTISODIYOT, AVTOMATIK SEX ISHLAB CHIQARISHI VA AHOLI
    // =========================================================================
    function recalculateEconomy() {
      const zeroRates = { yogoch: 0, gosht: 0, tosh: 0, temir: 0, tuya: 0, oltin: 0, suv: 0, baliq: 0 };
      state.ratesPerSec = { ...zeroRates };

      Object.keys(state.sexes).forEach(wId => {
        const s = state.sexes[wId];
        if (!s.built) return;
        const speed = (0.8 + s.level * 0.65) * (0.6 + (s.workers + state.workers.sex * 0.25) * 0.45);
        state.ratesPerSec[s.resA] += Number((speed * 1.2).toFixed(2));
        state.ratesPerSec[s.resB] += Number((speed * 0.9).toFixed(2));
      });
    }

    setInterval(() => {
      recalculateEconomy();
      Object.keys(state.ratesPerSec).forEach(k => {
        state.warehouse[k] += state.ratesPerSec[k];
      });

      const millProd = 1.5 + state.workers.mill * 1.4;
      const foodNeed = state.population * 0.12;
      state.food = Math.max(0, state.food + millProd - foodNeed);

      const cap = TIERS[state.civTier - 1].popCap;
      if (state.food > state.population * 1.2 && state.population < cap && Math.random() < 0.25) {
        state.population += 1;
        rebuild3DNpcs();
      }

      updateHud();
    }, 1000);

    // =========================================================================
    // 8. KAMERA (360°), SENSORLI JOYSTIK VA KONTEKSTLI TUGMALAR
    // =========================================================================
    let camYaw = 0, camPitch = 0.52, camDist = 14;
    let isDraggingCam = false, lastPointerX = 0, lastPointerY = 0;

    renderer.domElement.addEventListener("pointerdown", (e) => {
      isDraggingCam = true;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
    });

    window.addEventListener("pointermove", (e) => {
      if (!isDraggingCam) return;
      const dx = e.clientX - lastPointerX;
      const dy = e.clientY - lastPointerY;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      camYaw -= dx * 0.007;
      camPitch = Math.max(0.18, Math.min(1.25, camPitch + dy * 0.006));
    });

    window.addEventListener("pointerup", () => { isDraggingCam = false; });

    renderer.domElement.addEventListener("wheel", (e) => {
      e.preventDefault();
      camDist = Math.max(5.5, Math.min(34, camDist + e.deltaY * 0.012));
    }, { passive: false });

    const joyZone = document.getElementById("joy-zone");
    const joyKnob = document.getElementById("joy-knob");
    let joyActive = false, joyVec = { x: 0, y: 0 };

    function updateJoystick(clientX, clientY) {
      const rect = joyZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const maxR = 42;
      let dx = clientX - cx, dy = clientY - cy;
      const len = Math.hypot(dx, dy);
      if (len > maxR) { dx = (dx / len) * maxR; dy = (dy / len) * maxR; }
      joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      joyVec.x = dx / maxR;
      joyVec.y = dy / maxR;
    }

    joyZone.addEventListener("pointerdown", (e) => { e.stopPropagation(); joyActive = true; updateJoystick(e.clientX, e.clientY); });
    window.addEventListener("pointermove", (e) => { if (joyActive) updateJoystick(e.clientX, e.clientY); });
    window.addEventListener("pointerup", () => {
      if (!joyActive) return;
      joyActive = false; joyVec = { x: 0, y: 0 };
      joyKnob.style.transform = "translate(0px, 0px)";
    });

    const actionZone = document.getElementById("action-zone");
    let lastActionSignature = "";

    function refreshActionButtons() {
      const nearby = interactables
        .map(item => ({ item, dist: player.position.distanceTo(item.pos) }))
        .filter(x => x.dist <= (x.item.radius || 5.0))
        .sort((a, b) => a.dist - b.dist)
        .slice(0, 3);

      const sig = nearby.map(x => `${x.item.id}:${x.item.label}`).join("|");
      if (sig === lastActionSignature) return;
      lastActionSignature = sig;

      actionZone.innerHTML = "";
      nearby.forEach(({ item }) => {
        const btn = document.createElement("button");
        btn.className = `action-btn ${item.style || ""}`;
        btn.textContent = item.label;
        btn.addEventListener("click", () => executeAction(item));
        actionZone.appendChild(btn);
      });
    }

    function executeAction(item) {
      if (item.actionType === "enter_building") {
        state.insideBuilding = item.data.building;
        buildInteriorScene(item.data.building);
      } else if (item.actionType === "exit_building") {
        const prev = state.insideBuilding;
        state.insideBuilding = null;
        buildMainWorld();
        if (prev) player.position.set(prev.x, 0, prev.z + 7.5);
        showToast("Tashqariga chiqdingiz");
      } else if (item.actionType === "toggle_door") {
        const k = item.data.doorKey;
        state.doorsOpen[k] = !state.doorsOpen[k];
        if (doorMeshes[k]) doorMeshes[k].pivot.rotation.y = state.doorsOpen[k] ? -Math.PI / 2 : 0;
        lastActionSignature = "";
        showToast(state.doorsOpen[k] ? "Eshik ochildi" : "Eshik yopildi");
      } else if (item.actionType === "rest_bed") {
        state.energy = 100;
        showToast("Yotoqda dam oldingiz — quvvat 100% tiklandi!");
        updateHud();
      } else if (item.actionType === "mill_food") {
        state.food += 30;
        showToast("Tegirmonda +30 oziq-ovqat tayyorlandi!");
        updateHud();
      } else if (item.actionType === "open_storage") {
        openWarehouseModal();
      } else if (item.actionType === "open_council") {
        openCouncilModal();
      } else if (item.actionType === "enter_cave") {
        switchWorld("cave");
      } else if (item.actionType === "enter_subworld") {
        switchWorld(item.data.worldId);
      } else if (item.actionType === "go_main") {
        switchWorld("main");
      } else if (item.actionType === "manage_sex") {
        openSexModal(item.data.worldId);
      }
    }

    function openWarehouseModal() {
      recalculateEconomy();
      const rows = Object.keys(RESOURCE_META).map(k => {
        const m = RESOURCE_META[k];
        const amt = Math.floor(state.warehouse[k]);
        const rate = state.ratesPerSec[k];
        return `<div class="stat-box">
          <div style="font-weight:700; color:#7dd3fc;">${m.label} <span style="color:#94a3b8; font-size:11px;">(${m.world})</span></div>
          <div style="font-size:18px; font-weight:700; margin-top:4px;">${amt.toLocaleString()} ta</div>

        </div>`;
      }).join("");

      openModal(

        `<div style="margin-bottom:10px; color:#cbd5e1; font-size:13px;">
          Sig'im: <b>Cheksiz</b> | 3D Aholi: <b>${state.population}</b> | Oziq-ovqat: <b>${Math.floor(state.food)}</b> | Quvvat: <b>${state.energy}%</b>

        <div class="grid-2">${rows}</div>`

    function openUpgradeModal() {
      const curr = TIERS[state.civTier - 1];
      const next = TIERS[state.civTier] || null;

      let nextHtml = `<div class="stat-box" style="margin-bottom:12px; color:#4ade80;">Siz eng yuqori 5-bosqich — <b>Qirollik</b> darajasidasiz!</div>`;
      if (next) {
        const costText = Object.entries(next.cost)
          .map(([k, v]) => `${RESOURCE_META[k].label}: ${Math.floor(state.warehouse[k])}/${v}`)
          .join(" • ");
        const canAfford = Object.entries(next.cost).every(([k, v]) => state.warehouse[k] >= v);
        nextHtml = `<div class="stat-box" style="margin-bottom:12px;">
          <div style="font-weight:700; color:#fbbf24;">Keyingi bosqich: ${next.name} (${next.level}/5) — ${next.buildingsCount} ta bino</div>
          <div style="font-size:12px; color:#cbd5e1; margin-top:4px;">Talab: ${costText}</div>
          <div class="row-flex">
            <button class="mini-btn" id="btn-do-civ-upgrade" ${canAfford ? "" : "disabled style='opacity:0.45'"}>
              Bosqichni ko'tarish
            </button>
          </div>
        </div>`;
      }

      const bList = ALL_20_BUILDINGS.slice(0, curr.buildingsCount).map(b => {
        const lvl = state.buildingLevels[b.id];
        return `<div class="stat-box row-flex">
          <div>
            <b>${getBuildingDisplayName(b)}</b>
            <div style="font-size:11px; color:#94a3b8;">Bosqich: ${lvl}/5</div>
          </div>
          <button class="mini-btn b-up-btn" data-bid="${b.id}" ${lvl >= 5 ? "disabled" : ""}>
            ${lvl >= 5 ? "Max" : "+1 Lv (25 Yog'och, 20 Tosh)"}
          </button>
        </div>`;
      }).join("");

      openModal(
        `Rivojlanish: ${curr.name} (${curr.level}/5) — ${curr.buildingsCount}/20 Bino`,
        `${nextHtml}<div class="grid-2">${bList}</div>`
      );

      const upBtn = document.getElementById("btn-do-civ-upgrade");
      if (upBtn && next) {
        upBtn.onclick = () => {
          Object.entries(next.cost).forEach(([k, v]) => { state.warehouse[k] -= v; });
          state.civTier += 1;
          showToast(`Tabriklaymiz! Maqom: ${next.name} (${next.buildingsCount} ta bino)`);
          if (state.currentWorld === "main") buildMainWorld();
          updateHud();
          openUpgradeModal();
        };
      }

      document.querySelectorAll(".b-up-btn").forEach(btn => {
        btn.onclick = () => {
          const bid = btn.getAttribute("data-bid");
          if (state.warehouse.yogoch >= 25 && state.warehouse.tosh >= 20 && state.buildingLevels[bid] < 5) {
            state.warehouse.yogoch -= 25;
            state.warehouse.tosh -= 20;
            state.buildingLevels[bid] += 1;
            showToast("Bino darajasi oshirildi!");
            if (state.currentWorld === "main") buildMainWorld();
            updateHud();
            openUpgradeModal();
          } else {
            showToast("Yog'och (25) yoki Tosh (20) yetarli emas!");
          }
        };
      });
    }

    function openCouncilModal() {
      const totalAssigned = state.workers.mill + state.workers.sex + state.workers.builder;
      const freePop = Math.max(0, state.population - totalAssigned);

      function workerRow(key, title, desc) {
        return `<div class="stat-box row-flex">
          <div>
            <b>${title}: ${state.workers[key]} ta</b>
            <div style="font-size:12px; color:#94a3b8;">${desc}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="mini-btn gray w-dec" data-w="${key}">-</button>
            <button class="mini-btn w-inc" data-w="${key}">+</button>
          </div>
        </div>`;
      }

      openModal(
        "Aholi Yig'ini — 3D Aholi va Ish Taqsimoti",
        `<div class="stat-box" style="margin-bottom:10px;">
          Jami 3D aholi: <b>${state.population}</b> | Bo'sh aholi: <b>${freePop}</b> | Oziq-ovqat: <b>${Math.floor(state.food)}</b>
        </div>
        ${workerRow("mill", "Tegirmon ishchilari (Qop ko'targan)", "Tegirmon va ombor o'rtasida qop tashib oziq-ovqat yetkazadi")}
        ${workerRow("sex", "Sex ishchilari (Sandiq ko'targan)", "Ombor va g'or yo'nalishida yuk tashib mahsulot tezligini oshiradi")}
        ${workerRow("builder", "Quruvchi / Qo'riqchi", "Shahar va binolar ichida tartib hamda qurilishni qo'llaydi")}`
      );

      document.querySelectorAll(".w-inc").forEach(b => {
        b.onclick = () => {
          const k = b.getAttribute("data-w");
          const used = state.workers.mill + state.workers.sex + state.workers.builder;
          if (used < state.population) {
            state.workers[k] += 1;
            recalculateEconomy();
            rebuild3DNpcs();
            openCouncilModal();
            updateHud();
          } else {
            showToast("Bo'sh aholi qolmadi!");
          }
        };
      });

      document.querySelectorAll(".w-dec").forEach(b => {
        b.onclick = () => {
          const k = b.getAttribute("data-w");
          if (state.workers[k] > 0) {
            state.workers[k] -= 1;
            recalculateEconomy();
            rebuild3DNpcs();
            openCouncilModal();
            updateHud();
          }
        };
      });
    }

            showToast("Oltin (40) yoki Temir (30) yetarli emas!");
          }
        };
      }
    }

    function openMapModal() {
      openModal(
        "60,000 × 60,000 Dunyo Xaritasi va Tezkor O'tish",
        `<div class="stat-box" style="margin-bottom:10px; font-size:13px; color:#cbd5e1;">
          Dunyo o'lchami: <b>60,000 × 60,000</b> birlik.<br/>
          Sharqiy g'or ichida <b>4 ta portal</b> (O'rmon, Dengiz, Cho'l, Tog') mavjud. Har bir olam boshida ozgina yashil o'rmon bilan boshlanadi.
        </div>
        <div class="grid-2">
          <button class="mini-btn" onclick="switchWorld('main'); document.getElementById('modal-backdrop').style.display='none';">Asosiy Olam (Shahar)</button>
          <button class="mini-btn" onclick="switchWorld('cave'); document.getElementById('modal-backdrop').style.display='none';">Sharqiy G'or (4 Portal)</button>
          <button class="mini-btn" onclick="switchWorld('ormon'); document.getElementById('modal-backdrop').style.display='none';">O'rmon (Yog'och, Go'sht)</button>
          <button class="mini-btn" onclick="switchWorld('dengiz'); document.getElementById('modal-backdrop').style.display='none';">Dengiz (Suv, Baliq)</button>
          <button class="mini-btn" onclick="switchWorld('chol'); document.getElementById('modal-backdrop').style.display='none';">Cho'l (Tuya, Oltin)</button>
          <button class="mini-btn" onclick="switchWorld('tog'); document.getElementById('modal-backdrop').style.display='none';">Tog' (Tosh, Temir)</button>
        </div>`
      );
    }

    document.getElementById("btn-open-upgrade").onclick = openUpgradeModal;
    document.getElementById("btn-open-warehouse").onclick = openWarehouseModal;
    document.getElementById("btn-open-map").onclick = openMapModal;

    function updateHud() {
      const tier = TIERS[state.civTier - 1];
      const worldNames = {
        main: `Asosiy Olam — ${tier.name}`,
        cave: "Sharqiy G'or (Portallar)",
        ormon: "O'rmon Olami",
        dengiz: "Dengiz Olami",
        chol: "Cho'l Olami",
        tog: "Tog' Olami"
      };
      document.getElementById("world-label").textContent = `${worldNames[state.currentWorld]} (${state.civTier}/5)`;
      const gx = Math.round(player.position.x * 120);
      const gz = Math.round(player.position.z * 120);
      document.getElementById("world-sub").textContent =
        `Binolar: ${tier.buildingsCount}/20 | 3D Aholi: ${state.population} | Ovqat: ${Math.floor(state.food)} | Koordinata: (${gx}, ${gz})`;
    }

    // =========================================================================
    // 10. ASOSIY ANIMATSIYA TSIKLI
    // =========================================================================
    buildMainWorld();
    recalculateEconomy();
    updateHud();

    let prevTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - prevTime) / 1000);
      prevTime = now;

      worldGroup.traverse(obj => {
        if (obj.userData && obj.userData.isMillBlade) {
          obj.rotation.z += dt * 1.4;
        }
      });

      update3DNpcs(dt);

      const moveSpeed = 12.5;
      const forward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
      const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));

      const moveDir = new THREE.Vector3();
      moveDir.addScaledVector(forward, -joyVec.y);
      moveDir.addScaledVector(right, joyVec.x);

      if (moveDir.lengthSq() > 0.001) {
        moveDir.normalize();
        const nextX = THREE.MathUtils.clamp(player.position.x + moveDir.x * moveSpeed * dt, -240, 240);
        const nextZ = THREE.MathUtils.clamp(player.position.z + moveDir.z * moveSpeed * dt, -240, 240);

        const blocked = colliders.some(c =>
          nextX > c.minX - 0.6 && nextX < c.maxX + 0.6 &&
          nextZ > c.minZ - 0.6 && nextZ < c.maxZ + 0.6
        );
        if (!blocked) {
          player.position.x = nextX;
          player.position.z = nextZ;
        }

        player.rotation.y = Math.atan2(moveDir.x, moveDir.z);

        player.userData.walkPhase += dt * 11;
        const swing = Math.sin(player.userData.walkPhase) * 0.65;
        player.userData.leftLegPivot.rotation.x = swing;
        player.userData.rightLegPivot.rotation.x = -swing;
        player.userData.leftArmPivot.rotation.x = -swing * 0.75;
        player.userData.rightArmPivot.rotation.x = swing * 0.75;
      } else {
        player.userData.leftLegPivot.rotation.x *= 0.8;
        player.userData.rightLegPivot.rotation.x *= 0.8;
        player.userData.leftArmPivot.rotation.x *= 0.8;
        player.userData.rightArmPivot.rotation.x *= 0.8;
      }

      const horizDist = Math.cos(camPitch) * camDist;
      const vertDist = Math.sin(camPitch) * camDist;
      const targetLook = new THREE.Vector3(player.position.x, 1.6, player.position.z);
      camera.position.set(
        targetLook.x + Math.sin(camYaw) * horizDist,
        targetLook.y + vertDist,
        targetLook.z + Math.cos(camYaw) * horizDist
      );
      camera.lookAt(targetLook);

      dirLight.position.set(player.position.x + 35, 65, player.position.z + 25);
      dirLight.target.position.copy(player.position);

      refreshActionButtons();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(animate);
  </script>
</body>
</html>
